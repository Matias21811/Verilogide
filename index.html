<script>
const $=id=>document.getElementById(id);
const AND=`module and_gate(
  input  a,
  input  b,
  output y
);
  assign y = a & b;
endmodule
`,TB=`\`timescale 1ns/1ps

  reg a, b;
  wire y;
  and_gate dut(.a(a), .b(b), .y(y));
  initial begin
    a=0; b=0; #10;
    a=0; b=1; #10;
    a=1; b=0; #10;
    a=1; b=1; #10;
    $display("Fin de la simulacion, y=%b", y);
    $finish;

`;
let files=[{n:'and_gate.v',c:AND},{n:'tb_and_gate.v',c:TB}];

 tas[i].oninput=()=>{files[P[i]].c=tas[i].value;gut(i);save()};
 tas[i].onscroll=()=>gts[i].scrollTop=tas[i].scrollTop;
 tas[i].onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();tas[i].setRangeText('  ',tas[i].selectionStart,tas[i].selectionEnd,'end');tas[i].oninput()}}});
$('bn').onclick=()=>{let n=prompt('Nombre del archivo (si contiene "tb" o "test" va al panel Testbench):','modulo.v');if(!n)return;n=n.replace(/[^\w.-]/g,'_');if(!/\.s?v$/.test(n))n+='.v';

 while(i<src.length&&(re.lastIndex=i,m=re.exec(src))){i=re.lastIndex;const s=m[0];if(m[1])t.push({k:'n',v:s,l});else if(m[2])t.push({k:'i',v:s,l});else if(m[3])t.push({k:'s',v:s,l});else if(m[4])t.push({k:'o',v:s,l});l+=(s.match(/\n/g)||[]).length}return t}

 const is=v=>T[p]&&T[p].v===v&&T[p].k!=='s',acc=v=>is(v)?(p++,1):0;

 const E=()=>{const c=B(0);if(acc('?')){const a=E();ex(':');return{t:'?',c,a,b:E()}}return c};
 const B=n=>{if(n>=BIN.length)return U();let a=B(n+1);while(T[p]&&T[p].k==='o'&&BIN[n].includes(T[p].v)){const o=T[p++].v;a={t:'b',o,a,b:B(n+1)}}return a};
 const U=()=>{const t=T[p];if(!t)err('expresión incompleta');if(t.k==='o'&&['!','~','-','+','&','|','^','~&','~|','~^'].includes(t.v)){p++;return{t:'u',o:t.v,a:U()}}return Pr()};

  if(t.k==='i'){if(t.v[0]==='$'){const a=[];if(acc('(')){if(!is(')'))do a.push(E());while(acc(','));ex(')')}return{t:'f',n:t.v,a}}

  if(t.k==='i'&&t.v[0]==='$'){const e=Pr();ex(';');return{t:'x',e}}
  if(t.k!=='i')err(`símbolo inesperado '${t.v}'`,t);const a=SA();ex(';');return a};

 while(p<T.length){const mt=T[p];ex('module');const m={name:id(),pl:[],dn:new Set(),items:[],file,line:mt.l};R=m.refs=[];
  if(mods[m.name])err(`módulo '${m.name}' duplicado`,mt);mods[m.name]=m;

  if(acc('(')){let dir=null,reg=0,rng=null;while(!is(')')){if(!T[p])err("falta ')'");
    if(is('input')||is('output')||is('inout')){dir=T[p++].v;reg=acc('reg');if(!reg)acc('wire');acc('signed');rng=RG()}
    const n=id();m.pl.push(n);m.dn.add(n);if(dir)m.items.push({t:'d',dir,reg,rng,n});acc(',')}p++}
  ex(';');
  while(!acc('endmodule')){const t=T[p];if(!t)err("falta 'endmodule'",mt);
   if(is('input')||is('output')||is('inout')){const dir=T[p++].v;const reg=acc('reg');if(!reg)acc('wire');acc('signed');DL(dir,reg,RG());ex(';')}
   else if(is('wire')||is('reg')||is('integer')||is('genvar')){const k=T[p++].v;const r=k!=='wire';acc('signed');DL(null,r,RG(),k==='integer'?'int':0);ex(';')}

   else if(acc('always')){let ev=null;if(acc('@'))ev=EV();m.items.push({t:'al',ev,s:S()})}
   else if(t.k==='i'&&PR[t.v]){p++;if(T[p]&&T[p].k==='i')p++;ex('(');const a=[E()];while(acc(','))a.push(E());ex(')');ex(';');const op=PR[t.v];let r=a[1];
    if(op==='~')r={t:'u',o:'~',a:r};else{for(let k=2;k<a.length;k++)r={t:'b',o:op[0],a:r,b:a[k]};if(op.length>1)r={t:'u',o:'~',a:r}}m.items.push({t:'as',l:a[0],r})}
   else if(t.k==='i'&&T[p+1]&&(T[p+1].k==='i'||T[p+1].v==='#')&&!/^(function|task|generate|always_ff|always_comb)$/.test(t.v)){const mod=T[p++].v;
    if(acc('#')){ex('(');let d=1;while(d&&T[p]){if(is('('))d++;if(is(')'))d--;p++}}
    const name=id();ex('(');const conn=[];while(!is(')')){if(!T[p])err("falta ')'");if(acc('.')){const pn=id();ex('(');const e=is(')')?null:E();ex(')');conn.push({p:pn,e})}else conn.push({e:E()});acc(',')}p++;ex(';');m.items.push({t:'inst',mod,name,conn,l:t.l})}
   else err(`construcción inválida o no soportada: '${t.v}'`,t)}}}
function parseAll(){for(const k in mods)delete mods[k];const er=[];
 files.forEach(f=>{try{parse(f.c,f.n)}catch(e){if(e.msg)er.push(`${f.n}:${e.line}: error: ${e.msg}`);else throw e}});
 if(!er.length)for(const m of Object.values(mods)){m.refs.forEach(t=>{if(!m.dn.has(t.v))er.push(`${m.file}:${t.l}: error: '${t.v}' no está declarado en el módulo ${m.name}`)});

 case'c':{let v=0n,w=0;for(const x of e.l){const[a,b]=ev(x,p);v=(v<<BigInt(b))|a;w+=b}return[v,w]}

   else{if(o){if(it.rng||it.k==='int')o.w=w;o.reg=o.reg||it.reg}else S_[k]={w,v:0n,reg:it.reg};
    if(it.init){if(it.reg)S_[k].v=mk(cv(it.init),w);else asg.push({l:{t:'i',n:it.n},lp:pre,r:it.init,rp:pre})}}break}
  case'as':asg.push({l:it.l,lp:pre,r:it.r,rp:pre});break;
  case'init':pr.push({g:ini(it.s,pre),t:0});break;
  case'al':if(it.ev&&it.ev.every(c=>c.e==='*'||c.e==='any'))cmb.push({s:it.s,p:pre});else pr.push({g:alw(it.ev,it.s,pre),t:0});break;
  case'inst':{const cm=mods[it.mod],cp=pre+it.name+'.';elab(it.mod,cp,depth+1);
   it.conn.forEach((c,i)=>{if(!c.e)return;const pn=c.p||cm.pl[i],d=cm.items.find(x=>x.t==='d'&&x.n===pn&&x.dir);if(!d)return;
    if(d.dir==='input')asg.push({l:{t:'i',n:pn},lp:cp,r:c.e,rp:pre});else asg.push({l:c.e,lp:pre,r:{t:'i',n:pn},rp:cp})})}}}
function simulate(maxT){S_={};asg=[];cmb=[];pr=[];nba=[];T=0;fin=0;steps=0;out=[];mon=null;
 const inst=new Set();Object.values(mods).forEach(m=>m.items.forEach(i=>i.t==='inst'&&inst.add(i.mod)));
 const c=Object.keys(mods).filter(n=>!inst.has(n)),top=c.find(n=>/tb|test/i.test(n))||c[0];if(!top)throw{msg:'no hay módulos'};
 elab(top,'');out.push(`<span>Módulo top: ${top}</span>`);
 const settle=()=>{for(let k=0;k<200;k++){dirty=false;for(const a of asg)wr(a.l,ev(a.r,a.rp)[0],a.lp);for(const q of cmb)for(const _ of run(q.s,q.p));if(!dirty)return}};
 const hit=w=>w.some(c=>{const v=ev(c.x,c.p)[0];return c.e==='any'?v!==c.l:c.e==='pos'?(c.l&1n)===0n&&(v&1n)===1n:(c.l&1n)===1n&&(v&1n)===0n});
 const adv=P=>{const r=P.g.next();if(r.done){P.done=1;P.t=null;return}const y=r.value;
  if(y.d!==undefined){P.t=T+y.d;P.w=null}else{P.t=null;P.w=y.ev.filter(c=>c.x).map(c=>({e:c.e,x:c.x,p:y.p,l:ev(c.x,y.p)[0]}))}};
 const names=Object.keys(S_).filter(n=>!n.includes('.')&&!S_[n].param),hist={};names.forEach(n=>hist[n]=[]);
 const rec=()=>names.forEach(n=>{const h=hist[n];if(!h.length||h[h.length-1][1]!==S_[n].v)h.push([T,S_[n].v])});
 const stepT=()=>{for(let it=0;it<500;it++){let ran=false;
   for(const P of pr){if(P.done)continue;if(P.w){if(hit(P.w)){P.w=null;adv(P);ran=true}}else if(P.t===T){adv(P);ran=true}}
   settle();if(ran)continue;if(nba.length){const q=nba;nba=[];for(const[l,v,p]of q)wr(l,v,p);settle();continue}break}
  if(mon){const s=fmt(mon.e,mon.p);if(s!==mon.last){mon.last=s;out.push(`<span>[${T}] ${esc(s)}</span>`)}}};
 stepT();rec();let end=0;
 while(!fin){const ts=pr.filter(P=>!P.done&&P.t!=null).map(P=>P.t);if(!ts.length)break;const nt=Math.min(...ts);if(nt>maxT){end=maxT;break}T=nt;stepT();rec()}
 return{hist,end:Math.max(end,T,1),top,fin}}
// ---------- Diagrama
let HS=null,zoom=1;
function draw(){if(!HS)return;const{hist,end}=HS,names=Object.keys(hist),cv=$('wv'),cs=getComputedStyle(document.documentElement),C=n=>cs.getPropertyValue(n).trim(),
 rh=34,lw=110,top=24,base=Math.max(3,($('wrap').clientWidth-lw-24)/end),ppu=base*zoom,W=Math.ceil(lw+24+end*ppu),H=top+names.length*rh+6,d=devicePixelRatio||1;
 cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(d,d);x.font='12px ui-monospace,monospace';x.textBaseline='middle';
 let st=1;for(const s of [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000]){st=s;if(s*ppu>=55)break}
 x.strokeStyle=C('--bd');x.fillStyle=C('--fg');x.lineWidth=1;
 for(let t=0;t<=end;t+=st){const px=lw+t*ppu;x.beginPath();x.moveTo(px,top-4);x.lineTo(px,H);x.stroke();x.fillText(t,px+3,10)}
 names.forEach((n,i)=>{const y0=top+i*rh,h=hist[n],w=S_[n].w,hi=y0+6,lo=y0+rh-8;x.fillStyle=C('--fg');x.fillText(n+(w>1?`[${w-1}:0]`:''),6,y0+rh/2);
  x.lineWidth=2;x.strokeStyle=C(w>1?'--bus':'--ok');
  for(let k=0;k<h.length;k++){const x0=lw+h[k][0]*ppu,x1=lw+(k+1<h.length?h[k+1][0]:end)*ppu,v=h[k][1];
   if(w===1){const y=v?hi:lo;x.beginPath();if(k)x.moveTo(x0,h[k-1][1]?hi:lo);else x.moveTo(x0,y);x.lineTo(x0,y);x.lineTo(x1,y);x.stroke()}
   else{const m=y0+rh/2,s=4;x.beginPath();x.moveTo(x0,m);x.lineTo(x0+s,hi);x.lineTo(x1-s,hi);x.lineTo(x1,m);x.lineTo(x1-s,lo);x.lineTo(x0+s,lo);x.closePath();x.stroke();
    const tx=v.toString(16).toUpperCase();if(x1-x0>tx.length*8+14){x.fillStyle=C('--fg');x.fillText(tx,(x0+x1)/2-tx.length*3.5,m)}}}})}
// ---------- Acciones
const log=(h)=>$('con').innerHTML=h;
$('bc').onclick=()=>{const er=parseAll();log(er.length?er.map(e=>`<span class="e">${esc(e)}</span>`).join('\n')+`\n<span class="e">✘ ${er.length} error(es)</span>`:`<span class="o">✔ Sintaxis correcta (${Object.keys(mods).length} módulo(s): ${Object.keys(mods).join(', ')})</span>`)};
$('bs').onclick=()=>{const er=parseAll();if(er.length){log(er.map(e=>`<span class="e">${esc(e)}</span>`).join('\n')+'\n<span class="e">✘ Corrige los errores antes de simular</span>');return}
 try{HS=simulate(+$('tm').value||200);S_=S_;draw();log(out.join('\n')+`\n<span class="o">✔ Simulación terminada en t=${HS.end}${HS.fin?' ($finish)':''}</span>`)}
 catch(e){if(!e.msg)throw e;log(out.join('\n')+`\n<span class="e">✘ Error de simulación: ${esc(e.msg)}</span>`)}};
$('z1').onclick=()=>{zoom=Math.max(.25,zoom/1.5);draw()};$('z2').onclick=()=>{zoom=Math.min(40,zoom*1.5);draw()};
addEventListener('resize',draw);fill();$('bs').click();
</script></body></html>
